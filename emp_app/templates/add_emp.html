<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Office Employee Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>Add Employee</h1>
    <hr>

    <form action="/add_emp" method="POST">

        {% csrf_token %}

        <label>First Name</label><br>
        <input type="text" name="first_name" required>
        <br><br>

        <label>Last Name</label><br>
        <input type="text" name="last_name" required>
        <br><br>

        <label>Salary</label><br>
        <input type="number" name="salary" required>
        <br><br>

        <label>Department</label><br>

        <select name="dept" required>

            {% for dept in departments %}

                <option value="{{ dept.name }}">
                    {{ dept.name }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Role</label><br>

        <select name="role" required>

            {% for role in roles %}

                <option value="{{ role.name }}">
                    {{ role.name }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Bonus</label><br>
        <input type="number" name="bonus" required>
        <br><br>

        <label>Location</label><br>
        <input type="text" name="location">
        <br><br>

        <button type="submit" class="btn btn-primary">
            Submit
        </button>

    </form>

    <hr>

    <a class="btn btn-primary" href="/all_emp">
        View all employee
    </a>

    <a class="btn btn-primary" href="/remove_emp">
        Remove an employee
    </a>

    <a class="btn btn-primary" href="/filter_emp">
        Filter Employee
    </a>

</div>

</body>
</html>
